<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Kéo Co Sinh Học 12 - Đang chuyển hướng...</title>
    <script>
      // Single Page Apps for GitHub Pages redirect
      // Redirects 404 routes back to root index.html
      var pathSegments = location.pathname.split('/').filter(Boolean);
      var repoName = pathSegments.length > 0 ? pathSegments[0] : '';
      var redirectUrl = location.origin + (repoName ? '/' + repoName + '/' : '/');
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background:#020617;color:#94a3b8;font-family:sans-serif;text-align:center;padding-top:50px;">
    <p>Đang chuyển hướng về trang chủ trò chơi...</p>
  </body>
</html>
