  <body class="font-sans antialiased selection:bg-amber-200 selection:text-amber-900 bg-slate-950 text-slate-100 min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; gap: 16px; padding: 24px; text-align: center;">
        <div style="width: 52px; height: 52px; border: 4px solid #1e293b; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <div style="font-size: 22px; font-weight: 700; color: #34d399; letter-spacing: -0.5px;">🧬 Kéo Co Sinh Học 12</div>
        <div style="font-size: 14px; color: #94a3b8;">Đang khởi động đấu trường Mendel vs Morgan...</div>
        <noscript>
          <div style="margin-top: 16px; padding: 12px 20px; background: #7f1d1d; color: #fecaca; border-radius: 8px; font-size: 14px;">
            Trình duyệt của bạn đang tắt JavaScript. Vui lòng bật JavaScript để chơi trò chơi.
          </div>
        </noscript>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('Đang khởi động') !== -1)) {
          console.error('App init error:', e);
          var errDiv = document.createElement('div');
          errDiv.style.cssText = 'padding: 20px; background: #1e1b4b; color: #e0e7ff; border: 1px solid #6366f1; border-radius: 12px; max-width: 600px; margin: 40px auto; font-family: sans-serif; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center;';
          errDiv.innerHTML = '<h3 style="color:#f43f5e;margin-top:0;font-size:18px;">⚠️ Không thể tải tài nguyên</h3>' +
            '<p style="font-size:14px;color:#cbd5e1;line-height:1.5;">Vui lòng thử tải lại trang hoặc kiểm tra kết nối mạng.</p>' +
            '<button onclick="location.reload()" style="background:#10b981;color:white;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:12px;">Tải lại trang</button>';
          root.appendChild(errDiv);
        }
      });
    </script>
  </body>
